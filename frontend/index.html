<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Agent Workbench</title>
<style>
  :root { --bg:#f4f5f7; --panel:#ffffff; --primary:#185fa5; --text:#222; --muted:#888; --user:#e6f1fb; --ai:#f1f3f5; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--primary); color:#fff; padding:14px 20px; font-size:16px; font-weight:600; }
  .layout { display:flex; height:calc(100vh - 52px); }
  .chat { flex:1; display:flex; flex-direction:column; }
  .messages { flex:1; overflow-y:auto; padding:18px; }
  .bubble { max-width:72%; padding:10px 14px; border-radius:12px; margin-bottom:12px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
  .user { background:var(--user); margin-left:auto; }
  .ai { background:var(--ai); margin-right:auto; }
  .cite { font-size:12px; color:var(--muted); margin-top:6px; }
  .inputbar { display:flex; gap:8px; padding:12px; border-top:1px solid #e3e5e8; background:var(--panel); }
  .inputbar input { flex:1; padding:10px 12px; border:1px solid #d6d9dd; border-radius:8px; font-size:14px; }
  button { padding:10px 16px; border:0; border-radius:8px; background:var(--primary); color:#fff; cursor:pointer; font-size:14px; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .side { width:320px; border-left:1px solid #e3e5e8; background:var(--panel); display:flex; flex-direction:column; }
  .side h3 { margin:0; padding:14px; font-size:14px; border-bottom:1px solid #eef0f2; }
  .side .body { padding:14px; overflow-y:auto; flex:1; }
  .side input { width:100%; padding:9px 11px; border:1px solid #d6d9dd; border-radius:8px; font-size:13px; margin-bottom:8px; }
  .hint { font-size:12px; color:var(--muted); line-height:1.6; }
  .hit { background:var(--ai); border-radius:8px; padding:8px 10px; margin-bottom:8px; font-size:13px; }
  .hit .src { color:var(--primary); font-size:12px; }
</style>
</head>
<body>
<header>AI Agent Workbench · 多模型 Agent 对话工作台</header>
<div class="layout">
  <div class="chat">
    <div class="messages" id="messages"></div>
    <div class="inputbar">
      <input id="msg" placeholder="输入消息，回车发送（RAG 知识库已加载后可直接问退款政策）" onkeydown="if(event.key==='Enter')send()" />
      <button id="sendBtn" onclick="send()">发送</button>
    </div>
  </div>
  <div class="side">
    <h3>知识库检索调试</h3>
    <div class="body">
      <div class="hint">先用 <code>python scripts/seed_demo.py</code> 加载演示知识库，再在此检索看召回内容。</div>
      <input id="q" placeholder="检索关键词，如：质量问题退货" />
      <button onclick="search()">检索</button>
      <div id="hits" style="margin-top:12px;"></div>
    </div>
  </div>
</div>

<script>
const SESSION = "demo-" + Date.now();
const msgs = document.getElementById("messages");

function addBubble(role, text) {
  const d = document.createElement("div");
  d.className = "bubble " + role;
  d.textContent = text || "";
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
  return d;
}

// 手动解析 SSE（因为 /chat/stream 是 POST，浏览器 EventSource 仅支持 GET）
function parseSSE(buffer) {
  const events = [];
  let idx;
  while ((idx = buffer.indexOf("\n\n")) >= 0) {
    const chunk = buffer.slice(0, idx);
    buffer = buffer.slice(idx + 2);
    let event = "message", data = "";
    for (const line of chunk.split("\n")) {
      if (line.startsWith("event:")) event = line.slice(6).trim();
      else if (line.startsWith("data:")) data += line.slice(5).replace(/^ /, "");
    }
    if (data) events.push({ event, data });
  }
  return { events, rest: buffer };
}

async function send() {
  const input = document.getElementById("msg");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  document.getElementById("sendBtn").disabled = true;
  addBubble("user", text);
  const aiBubble = addBubble("ai", "▍");

  try {
    const resp = await fetch("/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session: SESSION, message: text }),
    });
    if (!resp.ok) { aiBubble.textContent = "请求失败：" + resp.status; return; }
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
      let buf = "", full = "", metaText = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const { events, rest } = parseSSE(buf);
        buf = rest;
        for (const e of events) {
          if (e.event === "token") { full += e.data; aiBubble.textContent = full + "▍"; }
          else if (e.event === "error") { aiBubble.textContent = "出错：" + e.data; }
          else if (e.event === "meta") { metaText = e.data; }
          else if (e.event === "done") {
            aiBubble.textContent = full;
            if (metaText) {
              const c = document.createElement("div");
              c.className = "cite";
              c.textContent = "▸ 本回答由供应商：" + metaText;
              aiBubble.appendChild(c);
            }
          }
        }
        msgs.scrollTop = msgs.scrollHeight;
      }
  } catch (err) {
    aiBubble.textContent = "异常：" + err.message;
  } finally {
    document.getElementById("sendBtn").disabled = false;
  }
}

async function search() {
  const q = document.getElementById("q").value.trim();
  if (!q) return;
  const hits = document.getElementById("hits");
  hits.innerHTML = "<div class='hint'>检索中…</div>";
  try {
    const resp = await fetch("/search", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query: q, k: 3 }),
    });
    const data = await resp.json();
    if (!data.hits || data.hits.length === 0) {
      hits.innerHTML = "<div class='hint'>无召回结果（确认已 seed 知识库）</div>";
      return;
    }
    hits.innerHTML = data.hits.map(h =>
      `<div class='hit'><div class='src'>[${h.meta?.source || "未知"}]</div>${h.content}</div>`
    ).join("");
  } catch (err) {
    hits.innerHTML = "<div class='hint'>检索失败：" + err.message + "</div>";
  }
}
</script>
</body>
</html>
