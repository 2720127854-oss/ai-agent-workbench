# 一键拉起整个工作台：PostgreSQL(pgvector) + Redis + API
# 用法： docker compose up --build
services:
  postgres:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: agentdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d agentdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      POSTGRES_DSN: "postgres://app:app@postgres:5432/agentdb"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # 本地改代码即时生效（可选）：
      - ./app:/app/app
      # 让 seed / reset 脚本能在容器内直接执行，不依赖本机 Python 环境
      - ./scripts:/app/scripts
      - ./data:/app/data

volumes:
  pgdata:
